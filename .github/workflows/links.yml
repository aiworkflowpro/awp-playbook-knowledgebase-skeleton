name: Links

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # every Monday, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open an issue when the weekly run finds broken links
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml --no-progress './**/*.md'
          output: ./lychee/out.md
          fail: ${{ github.event_name != 'schedule' }}

      - name: Open an issue for broken links (weekly run only)
        if: github.event_name == 'schedule' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Broken links found by the weekly check
          content-filepath: ./lychee/out.md
          labels: broken-links
